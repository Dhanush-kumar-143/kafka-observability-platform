# Create with:  eksctl create cluster -f eks/cluster.yaml
# Two t3.large nodes cost real money: delete the cluster when you are done
# (eksctl delete cluster -f eks/cluster.yaml).
apiVersion: eksctl.io/v1alpha5
kind: ClusterConfig
metadata:
  name: kafka-obs-eks
  region: ap-south-1
  version: "1.30"
managedNodeGroups:
  - name: workers
    instanceType: t3.large
    desiredCapacity: 2
    minSize: 2
    maxSize: 3
    volumeSize: 30
    iam:
      withAddonPolicies:
        ebs: true
addons:
  - name: aws-ebs-csi-driver
