apiVersion: apps/v1
kind: Deployment
metadata:
  name: alertmanager
  namespace: kafka-obs
spec:
  replicas: 1
  selector:
    matchLabels: { app: alertmanager }
  template:
    metadata:
      labels: { app: alertmanager }
    spec:
      containers:
        - name: alertmanager
          image: prom/alertmanager:v0.27.0
          args: ["--config.file=/etc/alertmanager/alertmanager.yml"]
          ports:
            - { name: web, containerPort: 9093 }
          readinessProbe:
            httpGet: { path: /-/ready, port: 9093 }
          volumeMounts:
            - { name: config, mountPath: /etc/alertmanager }
          resources:
            requests: { cpu: 25m, memory: 64Mi }
            limits: { memory: 128Mi }
      volumes:
        - name: config
          configMap: { name: alertmanager-config }
---
apiVersion: v1
kind: Service
metadata:
  name: alertmanager
  namespace: kafka-obs
spec:
  selector: { app: alertmanager }
  ports:
    - { name: web, port: 9093, targetPort: 9093 }
