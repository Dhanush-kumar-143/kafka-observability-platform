# Config comes from the "prometheus-config" ConfigMap created by scripts/deploy-eks.sh
# from monitoring/prometheus/*. Service names match the docker-compose names, so the
# same prometheus.yml works in both environments.
# NOTE: storage is an emptyDir for simplicity. Use a PVC for anything beyond a demo.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: kafka-obs
spec:
  replicas: 1
  selector:
    matchLabels: { app: prometheus }
  template:
    metadata:
      labels: { app: prometheus }
    spec:
      securityContext:
        fsGroup: 65534
        runAsUser: 65534
        runAsNonRoot: true
      containers:
        - name: prometheus
          image: prom/prometheus:v2.53.0
          args:
            - --config.file=/etc/prometheus/prometheus.yml
            - --storage.tsdb.path=/prometheus
            - --storage.tsdb.retention.time=7d
          ports:
            - { name: web, containerPort: 9090 }
          readinessProbe:
            httpGet: { path: /-/ready, port: 9090 }
          volumeMounts:
            - { name: config, mountPath: /etc/prometheus }
            - { name: data, mountPath: /prometheus }
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { memory: 1Gi }
      volumes:
        - name: config
          configMap: { name: prometheus-config }
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: kafka-obs
spec:
  selector: { app: prometheus }
  ports:
    - { name: web, port: 9090, targetPort: 9090 }
