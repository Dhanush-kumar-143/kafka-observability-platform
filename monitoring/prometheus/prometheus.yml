global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alert_rules.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  # Broker internals via the JMX exporter java agent
  - job_name: kafka-jmx
    static_configs:
      - targets: ["kafka:7071"]

  # Topic offsets, consumer group lag, broker count
  - job_name: kafka-exporter
    static_configs:
      - targets: ["kafka-exporter:9308"]

  # Application metrics
  - job_name: obs-producer
    static_configs:
      - targets: ["producer:8000"]

  - job_name: obs-consumer
    static_configs:
      - targets: ["consumer:8001"]
